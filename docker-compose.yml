version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: Daddy_soda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-daddy_soda_house}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - Daddy_soda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-daddy_soda_house}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  Daddy_soda_pgdata:
    name: Daddy_soda_pgdata
