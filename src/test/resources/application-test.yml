spring:
  datasource:
    url: jdbc:h2:mem:Daddy_soda_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  api:
    base-path: /api/v1
  security:
    jwt:
      secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-testing-only
      expiration-ms: 86400000
  iot:
    api-key: test-iot-key
    offline-threshold-minutes: 30
  invoice:
    company-name: Daddy Soda House Pvt Ltd (Test)
    company-address: Test Street, Pune 411001
    company-mobile: "9999999999"
    company-email: test-accounts@Daddysoda.com
    company-gstin: 27AABCS1429B1Z1
    default-gst-rate-percent: 18.00
    storage-path: ./target/test-invoices
  enquiry:
    whatsapp-number: "919876543210"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.asalkartechworks.Daddysodahouse: DEBUG
    org.flywaydb: INFO
