spring:
  application:
    name: daddy-soda-house-backend
  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  api:
    base-path: /api/v1
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  bootstrap:
    admin:
      name: ${INITIAL_ADMIN_NAME:}
      mobile: ${INITIAL_ADMIN_MOBILE:}
      email: ${INITIAL_ADMIN_EMAIL:}
      password: ${INITIAL_ADMIN_PASSWORD:}
  iot:
    api-key: ${APP_IOT_API_KEY}
  invoice:
    company-name: ${COMPANY_NAME:Daddy Soda House Pvt Ltd}
    company-address: ${COMPANY_ADDRESS:Shop 12, Phoenix Marketcity, Viman Nagar, Pune, Maharashtra 411014}
    company-mobile: ${COMPANY_MOBILE:9999999999}
    company-email: ${COMPANY_EMAIL:accounts@daddysoda.com}
    company-gstin: ${COMPANY_GSTIN:27AABCS1429B1Z1}
    default-gst-rate-percent: ${DEFAULT_GST_RATE_PERCENT:18.00}
    storage-path: ${INVOICE_STORAGE_PATH:./storage/invoices}

# Default Springdoc settings (disabled by default in base configuration)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
    operations-sorter: method
    tags-sorter: alpha

# Actuator health endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Logging configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.asalkartechworks.daddysodahouse: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

---
# Development profile: Swagger/OpenAPI enabled
spring:
  config:
    activate:
      on-profile: dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
